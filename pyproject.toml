[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutkin"
version = "0.1.0"
description = "A Python package for quantifying and testing cell-to-cell transcriptional variability using scRNA-seq data"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.4",
    "scipy>=1.7",
    "scanpy>=1.9",
    "anndata>=0.8",
    "scikit-learn>=1.1"
]

[project.optional-dependencies]
plot = [
    "umap-learn>=0.5",
    "matplotlib>=3.5",
    "seaborn>=0.12"
]

[tool.setuptools.packages.find]
where = ["."]
